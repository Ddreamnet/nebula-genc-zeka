<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 236" fill="none" role="img" aria-label="Nova, Nebula'nın astronotu">
  <title>Nova — salute</title>

  <!-- anten -->
  <path d="M134 38L164 12" stroke="#152343" stroke-width="9" stroke-linecap="round"/>
  <path d="M134 38L164 12" stroke="#FFFBF2" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="166" cy="11" r="9" fill="#FF9F45" stroke="#152343" stroke-width="6"/>

  <!-- yaşam destek sırt ünitesi -->
  <rect x="62" y="112" width="76" height="62" rx="24" fill="#E7DCC6" stroke="#152343" stroke-width="7"/>

  <path d="M88 174L88 202" stroke="#152343" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M88 174L88 202" stroke="#FFFBF2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M89 206L74 206" stroke="#152343" stroke-width="29" stroke-linecap="round" fill="none"/>
  <path d="M89 206L74 206" stroke="#FF9F45" stroke-width="22" stroke-linecap="round" fill="none"/>

  <path d="M112 174L112 202" stroke="#152343" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M112 174L112 202" stroke="#FFFBF2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M111 206L126 206" stroke="#152343" stroke-width="29" stroke-linecap="round" fill="none"/>
  <path d="M111 206L126 206" stroke="#FF9F45" stroke-width="22" stroke-linecap="round" fill="none"/>

  <path d="M74 134L68.1 167.5" stroke="#152343" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M74 134L68.1 167.5" stroke="#FFFBF2" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M70.7 152.8L68.5 165.1" stroke="#FF9F45" stroke-width="19" stroke-linecap="butt" fill="none"/>
  <circle cx="67.1" cy="173.4" r="13" fill="#FFFBF2" stroke="#152343" stroke-width="7"/>


  <!-- gövde -->
  <rect x="66" y="108" width="68" height="78" rx="27" fill="#FFFBF2" stroke="#152343" stroke-width="7"/>

  <!-- göğüs paneli -->
  <g transform="translate(0 0)">
    <rect x="83" y="132" width="34" height="26" rx="8" fill="#FFFBF2" stroke="#152343" stroke-width="5"/>
    <circle cx="93" cy="141" r="3.6" fill="#2FD08A"/>
    <circle cx="93" cy="150" r="3.6" fill="#FF9F45"/>
    <rect x="101" y="139" width="11" height="4" rx="2" fill="#152343" opacity="0.35"/>
    <rect x="101" y="147" width="8" height="4" rx="2" fill="#152343" opacity="0.22"/>
  </g>

  <!-- kask yan podları -->
  <ellipse cx="46" cy="74" rx="11" ry="17" fill="#FFFBF2" stroke="#152343" stroke-width="7"/>
  <ellipse cx="154" cy="74" rx="11" ry="17" fill="#FFFBF2" stroke="#152343" stroke-width="7"/>

  <!-- kask + vizör -->
  <circle cx="100" cy="72" r="56" fill="#FFFBF2" stroke="#152343" stroke-width="7"/>
  <circle cx="100" cy="72" r="43" fill="#101B38"/>

  <!-- gözler (yüz yok, sadece iki ışık) -->
  <g transform="translate(0 0)">
    <rect x="73" y="57" width="25" height="30" rx="12" fill="#FF9F45" opacity="0.22"/>
    <rect x="102" y="57" width="25" height="30" rx="12" fill="#FF9F45" opacity="0.22"/>
    <rect x="77" y="61" width="17" height="22" rx="8.5" fill="#FF9F45"/>
    <rect x="106" y="61" width="17" height="22" rx="8.5" fill="#FF9F45"/>
  </g>

  <!-- vizördeki yıldız yansıması: Nova'nın imzası, hep sağ üstte -->
  <path d="M126 44l3.1 8.4 8.4 3.1-8.4 3.1-3.1 8.4-3.1-8.4-8.4-3.1 8.4-3.1z" fill="#FFFFFF" opacity="0.95" transform="translate(0 0)"/>

  <!-- kaskın önündeki kol: selam, el çenede gibi vizöre değen hareketler -->
  <path d="M126 134L168 112L142 56" stroke="#152343" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M126 134L168 112L142 56" stroke="#FFFBF2" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M158.9 92.4L145.6 63.8" stroke="#FF9F45" stroke-width="19" stroke-linecap="butt" fill="none"/>
  <circle cx="139.5" cy="50.6" r="13" fill="#FFFBF2" stroke="#152343" stroke-width="7"/>

</svg>
